# ──────────────────────────────────────────────────────────
# StockScan Frontend — Docker Image Build & Push
# ──────────────────────────────────────────────────────────
# Triggers:
#   - Push to main branch (auto-build latest)
#   - Git tag v*.*.* (build versioned release)
#   - Manual dispatch (with optional version override)
#
# Pushes images to GitHub Container Registry (ghcr.io)
# ──────────────────────────────────────────────────────────

name: Build & Push Frontend Image

on:
  push:
    branches: [main]
    paths:
      - 'nextjs_space/**'
      - 'enterprise/Dockerfile.frontend'
  tags:
    - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g., 1.0.0)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/stockscan-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with 'latest' on main branch push
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with version from git tag (v1.2.3 → 1.2.3)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Tag with manual version input
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            # Tag with short SHA for traceability
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./nextjs_space
          file: ./enterprise/Dockerfile.frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BACKEND_API_URL=http://localhost:3000
            NEXTAUTH_URL=http://localhost:3100

  # ── Optional: Notify on completion ──
  notify:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build result
        run: |
          echo "Build status: ${{ needs.build-and-push.result }}"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
