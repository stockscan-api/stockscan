# StockScan Web Portal (Frontend)
# Pulls the pre-built image from GitHub Container Registry.
#
# Usage:
#   docker compose up -d
#
# Access:
#   Web Portal: http://<your-server-ip>:3100
#
# Prerequisites:
#   - StockScan API already running (via stockscan-standalone or similar)
#   - .env file configured (copy from .env.enterprise.example)

services:
  stockscan-frontend:
    image: ghcr.io/axletime/stockscan-frontend:latest
    ports:
      - "3100:3000"
    env_file:
      - .env
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
