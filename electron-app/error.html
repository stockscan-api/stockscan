<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockScan - Connection Error</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
      color: #f8fafc;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 40px;
    }
    .icon { font-size: 48px; margin-bottom: 20px; }
    h1 { font-size: 24px; margin-bottom: 12px; font-weight: 700; }
    .desc { color: #94a3b8; margin-bottom: 8px; font-size: 15px; }
    .hint { color: #64748b; font-size: 13px; margin-top: 16px; line-height: 1.6; }
    .actions { margin-top: 28px; display: flex; gap: 12px; }
    .btn {
      padding: 12px 32px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #e2e8f0; }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); }
  </style>
</head>
<body>
  <div class="icon">🔌</div>
  <h1>Unable to Connect</h1>
  <p class="desc">Could not reach the StockScan portal.</p>
  <p class="hint">
    Please check your internet connection and try again.<br>
    If the problem persists, go to <strong>Help → Run Setup Wizard</strong> to reconfigure.
  </p>
  <div class="actions">
    <button class="btn btn-primary" id="retryBtn">Retry Connection</button>
    <button class="btn btn-secondary" id="quitBtn">Quit</button>
  </div>

  <script>
    document.getElementById('retryBtn').addEventListener('click', function() {
      window.location.href = 'https://login.stockscan.uk';
    });

    document.getElementById('quitBtn').addEventListener('click', function() {
      window.close();
    });
  </script>
</body>
</html>
